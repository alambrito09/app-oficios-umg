services:
  # ============================================================================
  # Base de datos MySQL
  # ============================================================================
  db:
    image: mysql:8.0
    container_name: app_oficios_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_NAME:-app_oficios}
      MYSQL_USER: ${DB_USER:-oficios_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_oficios_net

  # ============================================================================
  # Aplicación PHP + Apache + CodeIgniter 3
  # ============================================================================
  web:
    build: .
    container_name: app_oficios_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      CI_ENV: ${CI_ENV:-development}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT_INTERNAL: ${DB_PORT_INTERNAL:-3306}
      DB_USER: ${DB_USER:-oficios_user}
      DB_PASSWORD: ${DB_PASSWORD:-oficios_password}
      DB_NAME: ${DB_NAME:-app_oficios}
      BASE_URL: ${BASE_URL:-http://localhost:8080/}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_CRYPTO: ${SMTP_CRYPTO:-tls}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-App Oficios}
    ports:
      - "${WEB_PORT:-8080}:80"
    networks:
      - app_oficios_net

  # ============================================================================
  # phpMyAdmin (opcional, para administrar la BD visualmente)
  # ============================================================================
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: app_oficios_phpmyadmin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ARBITRARY: 1
    ports:
      - "${PMA_PORT:-8081}:80"
    networks:
      - app_oficios_net

volumes:
  db_data:

networks:
  app_oficios_net:
    driver: bridge
